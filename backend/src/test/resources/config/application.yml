# Test-only overrides, loaded on top of src/main/resources/application.yml in every test context.
# Every @SpringBootTest migrates its database (fixtures/db/TestDatabase) on startup as the owner,
# as local does. This must be a property file rather than TestDatabase's DynamicPropertyRegistrar:
# Flyway's auto-configuration condition is evaluated before registrar beans run. A test that
# mirrors a shared environment sets spring.flyway.enabled=false itself. TestDatabase's registrar
# supplies DB_OWNER_*.
spring:
  flyway:
    enabled: true
    user: ${DB_OWNER_USERNAME:seed_owner}
    password: ${DB_OWNER_PASSWORD}
# The identity provider of every test context: tokens are minted by fixtures/security/TestJwt with
# this issuer and audience, and decoded by fixtures/security/TestSecurity.
OIDC_ISSUER_URI: https://issuer.seed.test/seed
OIDC_AUDIENCE: seed-api
CORS_ALLOWED_ORIGINS: http://localhost:4200
# Many tests write as the same TestJwt user, some on a stopped clock: the write rate limit would
# turn their writes into 429s. The rate-limit tests (WriteRateLimitIT, ConfiguredLimitsIT) set
# their own budget.
seed:
  limits:
    writes-per-minute: 1000000
