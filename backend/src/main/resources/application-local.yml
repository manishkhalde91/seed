# Local development: readable console lines instead of JSON, each prefixed with [<correlationId>].
# These lines are not masked; local never handles real secrets.
logging:
  structured:
    format:
      console: ""
  pattern:
    correlation: "[%X{correlationId:-}] "
springdoc:
  api-docs:
    enabled: ${SEED_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SEED_API_DOCS_ENABLED:true}
spring:
  # Local migrates on startup as DB_OWNER_USERNAME (from .env), then runs as DB_USERNAME.
  flyway:
    enabled: true
    user: ${DB_OWNER_USERNAME:seed_owner}
    password: ${DB_OWNER_PASSWORD}
