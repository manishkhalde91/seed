                    data:
                      $ref: "#/components/schemas/MeResponse"
                  required:
                  - data
          description: OK
          headers:
            X-Correlation-Id:
              description: "The request's correlation ID, also in the body's correlationId"
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Validation failed or malformed request
          headers:
            X-Correlation-Id:
              description: "The request's correlation ID, also in the body's correlationId"
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "Missing, invalid or expired token"
          headers:
            X-Correlation-Id:
              description: "The request's correlation ID, also in the body's correlationId"
              schema:
                type: string
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not allowed for the caller's roles
          headers:
            X-Correlation-Id:
              description: "The request's correlation ID, also in the body's correlationId"
              schema:
                type: string
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Resource missing or deleted
          headers:
            X-Correlation-Id:
              description: "The request's correlation ID, also in the body's correlationId"
              schema:
                type: string
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "Conflict with the stored state (duplicate, stale version,\
            \ state)"
          headers:
            X-Correlation-Id:
              description: "The request's correlation ID, also in the body's correlationId"
              schema:
                type: string
        "422":
