  /api/v1/me:
    get:
      operationId: getCurrentUser
      parameters:
      - description: Correlation ID to use for this request; replaced by a new one
          when invalid
        in: header
        name: X-Correlation-Id
        required: false
        schema:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,64}$"
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/ApiResponse"
