      - sample-record-controller
  /api/v1/sample-records/{id}/restore:
    post:
      operationId: restoreSampleRecord
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Correlation ID to use for this request; replaced by a new one
          when invalid
        in: header
        name: X-Correlation-Id
        required: false
        schema:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,64}$"
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/SampleRecordResponse"
                  required:
                  - data
          description: OK
          headers:
            X-Correlation-Id:
              description: "The request's correlation ID, also in the body's correlationId"
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Validation failed or malformed request
          headers:
            X-Correlation-Id:
              description: "The request's correlation ID, also in the body's correlationId"
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "Missing, invalid or expired token"
          headers:
            X-Correlation-Id:
              description: "The request's correlation ID, also in the body's correlationId"
              schema:
                type: string
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not allowed for the caller's roles
          headers:
            X-Correlation-Id:
              description: "The request's correlation ID, also in the body's correlationId"
              schema:
                type: string
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Resource missing or deleted
          headers:
            X-Correlation-Id:
              description: "The request's correlation ID, also in the body's correlationId"
              schema:
                type: string
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "Conflict with the stored state (duplicate, stale version,\
            \ state)"
          headers:
            X-Correlation-Id:
              description: "The request's correlation ID, also in the body's correlationId"
              schema:
                type: string
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Breaks a domain rule
          headers:
            X-Correlation-Id:
              description: "The request's correlation ID, also in the body's correlationId"
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Unexpected error; quote the correlation ID
          headers:
            X-Correlation-Id:
              description: "The request's correlation ID, also in the body's correlationId"
              schema:
                type: string
      tags:
      - sample-record-controller
components:
  schemas:
    ApiErrorResponse:
      type: object
      properties:
        correlationId:
          type: string
        errorCode:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        message:
          type: string
        path:
          type: string
        status:
          type: integer
          format: int32
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
      required:
      - correlationId
      - errorCode
      - errors
      - message
      - path
      - status
      - success
      - timestamp
    ApiResponse:
      type: object
      properties:
        correlationId:
          type: string
        data: {}
        message:
          type: string
        pagination:
          $ref: "#/components/schemas/PageMeta"
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
      required:
      - correlationId
      - data
      - message
      - success
      - timestamp
    CreateSampleRecordRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 1000
          minLength: 0
          pattern: "[^\\u0000]*"
        name:
          type: string
          maxLength: 100
          minLength: 1
          pattern: "[^\\u0000]*"
      required:
      - name
    FieldError:
      type: object
      properties:
        code:
          type: string
        field:
          type:
          - string
          - "null"
        message:
          type: string
        rejectedValue: {}
      required:
      - code
      - field
      - message
    MeResponse:
      type: object
      properties:
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        subject:
          type: string
      required:
      - name
      - roles
      - subject
    OperationAcceptedResponse:
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
        statusTopic:
          type: string
        version:
          type: integer
          format: int32
      required:
      - operationId
      - status
      - statusTopic
      - version
    OperationResponse:
      type: object
      properties:
        correlationId:
          type: string
        createdAt:
          type: string
          format: date-time
        errorCode:
          type:
          - string
          - "null"
        errorMessage:
          type:
          - string
          - "null"
        kind:
          type: string
        operationId:
          type: string
          format: uuid
        result:
          type:
          - object
          - "null"
          additionalProperties: {}
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
        statusTopic:
          type: string
        subjectId:
          type:
          - string
          - "null"
          format: uuid
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int32
      required:
      - correlationId
      - createdAt
      - errorCode
      - errorMessage
      - kind
      - operationId
      - result
      - status
      - statusTopic
      - subjectId
      - updatedAt
      - version
    PageMeta:
      type: object
      properties:
        hasNext:
          type: boolean
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
      - hasNext
      - page
      - size
      - totalElements
      - totalPages
    SampleRecordResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        description:
          type:
          - string
          - "null"
        id:
          type: string
          format: uuid
        name:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        version:
          type: integer
          format: int64
      required:
      - createdAt
      - createdBy
      - description
      - id
      - name
      - updatedAt
      - updatedBy
      - version
    UpdateSampleRecordRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 1000
          minLength: 0
          pattern: "[^\\u0000]*"
        name:
          type: string
          maxLength: 100
          minLength: 1
          pattern: "[^\\u0000]*"
        version:
          type: integer
          format: int64
          minimum: 0
      required:
      - name
      - version
  securitySchemes:
    bearer-jwt:
      bearerFormat: JWT
      scheme: bearer
      type: http
