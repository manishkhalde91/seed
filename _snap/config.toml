# ─────────────────────────────────────────────────────────────────
# Installer-managed. Regenerated on every install — treat as read-only.
#
# Direct edits to this file will be overwritten on the next install.
# To change an install answer durably, re-run the installer (your prior
# answers are remembered as defaults). To pin a value regardless of
# install answers, or to add custom agents / override descriptors, use:
#   _snap/custom/config.toml       (team, committed)
#   _snap/custom/config.user.toml  (personal, gitignored)
# Those files are never touched by the installer.
# ─────────────────────────────────────────────────────────────────

[core]
project_name = "monorepo"
document_output_language = "English"
output_folder = "_snap-output"
# Where the SnapCT context lake lives. Read in place by every skill via resolve_artifacts.py.
# Multi-repo systems pin a path up to the workspace root in _snap/custom/config.toml.
context_lake = "{project-root}/_snap-output/context"

[modules.snap-module]
planning_artifacts = "{project-root}/_snap-output/planning-artifacts"
implementation_artifacts = "{project-root}/_snap-output/implementation-artifacts"
project_knowledge = "{project-root}/docs"

[modules.tea]
test_artifacts = "{project-root}/_snap-output/test-artifacts"
tea_use_playwright_utils = true
tea_use_pactjs_utils = true
tea_pact_mcp = "mcp"
tea_browser_automation = "auto"
tea_execution_mode = "auto"
tea_capability_probe = true
test_stack_type = "auto"
ci_platform = "auto"
test_framework = "auto"
risk_threshold = "p1"
test_design_output = "_snap-output/test-artifacts/test-design"
test_review_output = "_snap-output/test-artifacts/test-reviews"
trace_output = "_snap-output/test-artifacts/traceability"

