# Local developer infrastructure only; not a deployment definition.
#
# Run from the repository root (see README "First-time setup"):
#   docker compose --env-file .env -f infrastructure/compose.yaml up -d
# `podman compose` takes the same arguments.
#
# Images are pinned by tag and multi-arch index digest. Ports bind to 127.0.0.1 only and can be
# changed in .env (POSTGRES_PORT, OIDC_PORT). Object storage is not part of this file yet: the
# STORAGE_* variables point at any S3-compatible store until the storage story adds a local one.

name: seed

services:
  postgres:
    image: docker.io/library/postgres:16.16-alpine3.24@sha256:0adbf25a9e96d38823bb813f3ac0ed41fadb665c88f1df7fe6dbfb060cbdc106
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      DB_NAME: ${DB_NAME:-seed_db}
      DB_OWNER_USERNAME: ${DB_OWNER_USERNAME:-seed_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
      DB_USERNAME: ${DB_USERNAME:-seed_app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready over TCP passes only once the init scripts have finished and the server listens;
      # the query then fails if init skipped or failed to create the application database.
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U postgres -d "$${DB_NAME}" &&
          psql -U postgres -d "$${DB_NAME}" -tAc 'select 1' | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.5@sha256:d88e445d55c4ff6eed59b02d86adfece47d985233b1616fb712669b98328c8a2
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/config.json
    ports:
      - "127.0.0.1:${OIDC_PORT:-8090}:8080"
    volumes:
      - ./oidc/config.json:/config/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/seed/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
